<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#6C5A9C" />
<title>Flappy Ticket</title>
<meta name="description" content="Fly a conference ticket between London phone boxes." />
<link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <main id="stage">
    <canvas id="game" width="360" height="640" aria-label="Flappy Ticket game"></canvas>

  </main>
  <p id="hint">Click, tap or press Space to flap</p>
  <script src="src/game.js"></script>
</body>
</html>
